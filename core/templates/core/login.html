<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — PropertyReels AI</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">▶ Property<strong>Reels</strong><span style="color:#a78bfa">AI</span></div>
    <h1 class="auth-title">Bienvenido de nuevo</h1>

    {% if messages %}{% for m in messages %}
      <div class="toast toast--{{ m.tags }}">{{ m }}</div>
    {% endfor %}{% endif %}

    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" class="input" required autofocus />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" class="input" required />
      </div>
      {% if form.non_field_errors %}
        <div class="toast toast--error">Usuario o contraseña incorrectos.</div>
      {% endif %}
      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>
    <p class="auth-switch">¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate</a></p>
  </div>
</body>
</html>
